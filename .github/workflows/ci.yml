name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.config }} ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            config: cli
          - os: ubuntu-24.04-arm
            arch: arm64
            config: cli
          - os: windows-latest
            arch: x86_64
            config: cli
          - os: macos-latest
            arch: arm64
            config: cli
          - os: macos-13
            arch: x86_64
            config: cli
          - os: ubuntu-latest
            arch: x86_64
            config: library
          - os: windows-latest
            arch: x86_64
            config: library
          - os: macos-latest
            arch: arm64
            config: library
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build
        run: dub build --config=${{ matrix.config }} --build=release

  gui-linux:
    name: gui ubuntu-latest x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build GUI
        run: dub build --config=gui --build=release
