name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.config }} ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            config: cli
          - os: ubuntu-24.04-arm
            arch: arm64
            config: cli
          - os: windows-latest
            arch: x86_64
            config: cli
          - os: windows-11-arm
            arch: arm64
            config: cli
          - os: macos-latest
            arch: arm64
            config: cli
          - os: macos-13
            arch: x86_64
            config: cli
          - os: ubuntu-latest
            arch: x86_64
            config: library
          - os: ubuntu-24.04-arm
            arch: arm64
            config: library
          - os: windows-latest
            arch: x86_64
            config: library
          - os: windows-11-arm
            arch: arm64
            config: library
          - os: macos-latest
            arch: arm64
            config: library
          - os: macos-13
            arch: x86_64
            config: library
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build
        run: dub build --config=${{ matrix.config }} --build=release

  # Native GUI build per OS (not cross-compile — each job links against that runner's Qt).
  gui:
    name: gui ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -O "$env:RUNNER_TEMP\Qt"
          $qt = Get-ChildItem "$env:RUNNER_TEMP\Qt\6.7.3" -Directory | Select-Object -First 1
          "QT_ROOT=$($qt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DFLAGS=-L/LIBPATH:$($qt.FullName)\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$($qt.FullName)\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Qt paths (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$(brew --prefix qt)/bin:$PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix qt)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix qt)/include:${CPATH:-}" >> "$GITHUB_ENV"
      - name: Build GUI
        run: dub build --config=gui --build=release
